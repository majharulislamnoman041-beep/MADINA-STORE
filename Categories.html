<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories - AL MADINA STORE</title>

<body class="min-h-screen flex flex-col">

    <!-- Header -->
<header class="flex items-center justify-between bg-amber-200 px-4 py-3 p-4">

    <!-- Store Name -->
    <h1 class="text-3xl font-bold">
        AL MADINA STORE
    </h1>

    <!-- Navigation -->
    <nav class="ml-auto mr-8 p-5 ">
        <ul class="flex gap-2">

            <li class="font-medium text-black border-2 py-3 px-4 rounded-lg hover:bg-amber-400 transition">
                <a href="home.html">🏠 Home</a>
            </li>

            <li class="font-medium text-black border-2 py-3 px-4 rounded-lg hover:bg-amber-400 transition">
                <a href="Products.html">📦 Products</a>
            </li>

            <li class="font-medium text-black border-2 py-3 px-4 rounded-lg hover:bg-amber-400 transition">
                <a href="Categories.html">☷ Categories</a>
            </li>

            <li class="font-medium text-black border-2 py-3 px-4 rounded-lg hover:bg-amber-400 transition">
                <a href="Contact.html">☎ Contact</a>
            </li>

        </ul>
    </nav>

</header>


    <!-- Navigation -->
    


    <!-- Main Content -->
    <main class="flex-1">

        <section>

            <h2 class="text-3xl font-bold text-center my-6">
                Product Categories
            </h2>


            <!-- Categories -->
            <div class=" bg-amber-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 p-6 justify-items-center ">

                <!-- Category 1 -->
                <div class="border-2 p-5 rounded-lg w-64 shadow-md text-center hover:shadow-xl hover:-translate-y-2 transition">
                    <h3 class="text-xl font-bold">Men's Fashion</h3>
                    <p class="text-gray-600 my-2">T-Shirts, Shirts, Pants and more.</p>
                    <button class="bg-black text-white px-4 py-2 rounded hover:bg-white hover:text-black">
                        View Products
                    </button>
                </div>

                <!-- Category 2 -->
                <div class="border-2 p-5 rounded-lg w-64 shadow-md text-center hover:shadow-xl hover:-translate-y-2 transition">
                    <h3 class="text-xl font-bold">Women's Fashion</h3>
                    <p class="text-gray-600 my-2">Dresses, Tops, Hijab and more.</p>
                    <button class="bg-black text-white px-4 py-2 rounded hover:bg-white hover:text-black">
                        View Products
                    </button>
                </div>

                <!-- Category 3 -->
                <div class="border-2 p-5 rounded-lg w-64 shadow-md text-center hover:shadow-xl hover:-translate-y-2 transition">
                    <h3 class="text-xl font-bold">Electronics</h3>
                    <p class="text-gray-600 my-2">Mobile, Headphones, Watches and more.</p>
                    <button class="bg-black text-white px-4 py-2 rounded hover:bg-white hover:text-black">
                        View Products
                    </button>
                </div>

                <!-- Category 4 -->
                <div class="border-2 p-5 rounded-lg w-64 shadow-md text-center hover:shadow-xl hover:-translate-y-2 transition">
                    <h3 class="text-xl font-bold">Accessories</h3>
                    <p class="text-gray-600 my-2">Bags, Wallets, Sunglasses and more.</p>
                    <button class="bg-black text-white px-4 py-2 rounded hover:bg-white hover:text-black">
                        View Products
                    </button>
                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="w-full">

        <svg class="block w-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
