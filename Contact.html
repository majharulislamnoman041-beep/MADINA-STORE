<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - AL MADINA STORE</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen flex flex-col m-3 p-2">

    <!-- Header -->
    <header class="flex items-center bg-amber-300 px-2 py-3 justify-between">

        <!-- Store Name -->
        <h1 class="text-3xl font-bold">
            AL MADINA STORE
        </h1>

        <!-- Navigation -->
        <nav class="ml-auto mr-8 text-center">
            <ul class="flex  gap-2">

                <li class="font-medium text-black border-2 py-2 px-3 rounded-lg 
text-center hover:bg-amber-400 hover:text-black hover:-translate-y-2 transition duration-300">
                    <a href="home.html">🏠 Home</a>
                </li>

                <li class="font-medium text-black border-2 py-2 px-3 rounded-lg 
text-center hover:bg-amber-400 hover:text-black hover:-translate-y-2 transition duration-300">
                    <a href="Products.html">📦 Products</a>
                </li>

                <li class="font-medium text-black border-2 py-2 px-3 rounded-lg 
text-center hover:bg-amber-400 hover:text-black hover:-translate-y-2 transition duration-300">
                    <a href="Categories.html">☷ Categories</a>
                </li>

                <li class="font-medium text-black border-2 py-2 px-3 rounded-lg 
text-center hover:bg-amber-400 hover:text-black hover:-translate-y-2 transition duration-300">
                    <a href="Contact.html">☎ Contact</a>
                </li>

            </ul>
        </nav>

    </header>

    <!-- Main Content -->
    <main class="flex-1">

        <section>

            <h2 class="text-3xl font-bold text-center my-8">
                Contact Us
            </h2>
            <br>
            <!-- Contact Information -->
            <div class="flex flex-wrap justify-center gap-6">

                <div
                    class=" border-2 rounded-lg p-5 text-center shadow-md w-64 hover:bg-amber-400 hover:-translate-y-2 hover:shadow-xl transition duration-300">
                    <h3 class="text-xl font-bold">📧 Email</h3>
                    <p class="mt-2">info@almadinastore.com</p>
                </div>

                <div
                    class=" border-2 rounded-lg p-5 text-center shadow-md w-64 hover:bg-amber-400 hover:-translate-y-2 hover:shadow-xl transition duration-300">
                    <h3 class="text-xl font-bold">📞 Phone</h3>
                    <p class="mt-2">+880 1234-567890</p>
                </div>

                <div
                    class=" border-2 rounded-lg p-5 text-center shadow-md w-64 hover:bg-amber-400 hover:-translate-y-2 hover:shadow-xl transition duration-300">
                    <h3 class="text-xl font-bold">📍 Location</h3>
                    <p class="mt-2">feni, Bangladesh</p>
                </div>

            </div>

            <br>
            <!-- Contact Form -->
            <form class="max-w-md mx-auto mt-10 p-6 border-2 rounded-lg shadow-md text-center">

                <div>
                    <label for="name" class="text-2xl font-bold">Name</label>
                    <input id="name" type="text" placeholder="Enter your name"
                        class=" w-full border-2 rounded-lg p-3 mt-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <div>
                    <label for="email" class="text-2xl font-bold">Email</label>
                    <input id="email" type="email" placeholder="Enter your email"
                        class=" w-full border-2 rounded-lg p-3 mt-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <div>
                    <label for="message" class="text-2xl font-bold">Message</label>
                    <textarea id="message" placeholder="Enter your message" rows="5"
                        class=" w-full border-2 rounded-lg p-3 mt-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
                </div>

                <button type="submit"
                    class="mt-4 bg-black text-white py-3 px-20 m-6 p-4 rounded-lg font-bold hover:bg-amber-400 hover:text-black transition duration-300">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>

        <svg class="block w-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">

            <path fill="#0099ff" fill-opacity="1"
                d="M0,288L80,256C160,224,320,160,480,122.7C640,85,800,75,960,112C1120,149,1280,235,1360,277.3L1440,320L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z">
            </path>

        </svg>

        <div class="bg-[#0099ff] text-center text-black py-4">
            © 2026 AL MADINA STORE. All Rights Reserved.
        </div>

    </footer>

</body>

</html>
