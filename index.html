<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AL MADINA STORE</title>

    <link rel="stylesheet" href="./src/output.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>


<body class="min-h-screen flex flex-col">


    <!-- Store Name -->
    <h1 class="bg-amber-200 text-2xl sm:text-3xl text-center font-bold py-3">
        AL MADINA STORE
    </h1>


    <!-- Navigation -->
    <nav class="p-3">


        <!-- Search + Menu Button -->
        <div class="flex items-center justify-between gap-3">

            <!-- Search -->
            <input
                type="text"
                placeholder="🔍 Search products..."
                class="w-full md:w-80 px-4 py-2 rounded-lg border-2 border-gray-300 focus:outline-none focus:border-amber-400"
            >


            <!-- Menu Button -->
            <button
                onclick="toggleMenu()"
                class="md:hidden text-2xl border-2 px-3 py-2 rounded hover:bg-amber-400"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>


        <!-- Menu -->
        <ul
            id="menu"
            class="hidden md:flex flex-col md:flex-row justify-center items-center gap-2 mt-3 md:mt-0"
        >

            <li
                class="w-full md:w-auto text-center font-medium text-black hover:bg-amber-400 border-2 py-2 px-3 rounded transition"
            >
                <a href="index.html">🏠 Home</a>
            </li>


            <li
                class="w-full md:w-auto text-center font-medium text-black hover:bg-amber-400 border-2 py-2 px-3 rounded transition"
            >
                <a href="Products.html">📦 Products</a>
            </li>


            <li
                class="w-full md:w-auto text-center font-medium text-black hover:bg-amber-400 border-2 py-2 px-3 rounded transition"
            >
                <a href="Categories.html">☷ Categories</a>
            </li>


            <li
                class="w-full md:w-auto text-center font-medium text-black hover:bg-amber-400 border-2 py-2 px-3 rounded transition"
            >
                <a href="Contact.html">☎ Contact</a>
            </li>


            <li
                class="w-full md:w-auto text-center font-medium text-black hover:bg-amber-400 border-2 py-2 px-3 rounded transition"
            >
                <a href="help.html">Help</a>
            </li>

        </ul>

    </nav>


    <!-- Hero Section -->
    <section
        class="flex-1 flex flex-col justify-center items-center text-center px-4 py-12"
    >

        <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold">
            Welcome to AL MADINA STORE
        </h2>


        <p class="text-gray-600 text-base sm:text-lg my-3">
            Discover quality products at the best prices.
        </p>


        <a
            href="Products.html"
            class="bg-black text-white px-5 py-2 rounded border-2 border-black hover:bg-white hover:text-black transition"
        >
            Shop Now
        </a>

    </section>


    <!-- Footer -->
    <footer class="bg-black text-white text-center py-5 px-3">

        <h2 class="text-xl font-bold text-amber-400">
            AL MADINA STORE
        </h2>


        <p class="text-sm text-gray-400 mt-1">
            Quality Products • Best Prices • Trusted Service
        </p>


        <p class="text-xs text-gray-500 mt-2">
            © 2026 AL MADINA STORE • All Rights Reserved
        </p>

    </footer>


    <!-- JavaScript -->
    <script>

        function toggleMenu() {

            document
                .getElementById("menu")
                .classList
                .toggle("hidden");

        }

    </script>


</body>

</html>
